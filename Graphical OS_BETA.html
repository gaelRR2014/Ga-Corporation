<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Graphical OS</title>
<style>
:root{--acc:#7aa7ff;--tx:#fff;--sub:rgba(255,255,255,.7);--g1:rgba(255,255,255,.26);--g2:rgba(255,255,255,.07);--bd:rgba(255,255,255,.38);--sh:rgba(0,0,0,.28);--appbg:rgba(12,14,30,.78)}
html.light{--tx:#14161f;--sub:rgba(20,22,31,.62);--g1:rgba(255,255,255,.72);--g2:rgba(255,255,255,.32);--bd:rgba(255,255,255,.85);--sh:rgba(40,50,90,.2);--appbg:rgba(238,242,255,.8)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#05060b;color:var(--tx);font-family:-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;touch-action:none}
body{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#os{position:relative;width:min(100vw,430px);height:100dvh;max-height:932px;overflow:hidden;background:#0b0d18}
@media(min-width:600px){#os{height:min(100dvh,900px);border-radius:48px;box-shadow:0 0 0 10px #151722,0 30px 80px #000}}
/* fondo */
#wall{position:absolute;inset:0;background:var(--bg);overflow:hidden;transition:background .6s}
.blob{position:absolute;width:75%;aspect-ratio:1;border-radius:50%;filter:blur(45px);opacity:.9;animation:fl 14s ease-in-out infinite alternate}
.blob:nth-child(1){background:var(--b1);top:-10%;left:-15%}
.blob:nth-child(2){background:var(--b2);top:35%;right:-30%;animation-duration:18s}
.blob:nth-child(3){background:var(--b3);bottom:-10%;left:0;animation-duration:22s}
@keyframes fl{to{transform:translate(12%,10%) scale(1.15)}}
/* cristal líquido */
.glass{position:relative;background:linear-gradient(145deg,var(--g1),var(--g2));-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--bd);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1px 2px rgba(255,255,255,.12),0 12px 32px var(--sh)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 60% at 18% 0%,rgba(255,255,255,.38),transparent 55%);pointer-events:none;opacity:.7}
html.refract .rf{backdrop-filter:url(#lg) blur(6px) saturate(1.8)}
/* barra de estado */
#sb{position:absolute;top:0;left:0;right:0;height:44px;padding:14px 26px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:600;z-index:12}
.bat{display:inline-block;width:24px;height:11px;border:1.5px solid var(--tx);border-radius:4px;margin-left:6px;position:relative;vertical-align:-1px}
.bat i{position:absolute;inset:1.5px;background:var(--tx);border-radius:1.5px}
#hb{position:absolute;bottom:0;left:25%;right:25%;height:30px;z-index:12}
#hb::after{content:"";position:absolute;bottom:8px;left:15%;right:15%;height:5px;border-radius:3px;background:var(--tx);opacity:.85}
/* inicio */
#home{position:absolute;inset:0;padding:60px 20px 0;transform:scale(.92);opacity:.5;transition:.5s cubic-bezier(.2,.9,.25,1);z-index:1}
#home.in{transform:none;opacity:1}
.widget{border-radius:30px;padding:18px 22px;margin-bottom:26px}
#wt{font-size:54px;font-weight:300;letter-spacing:-1px}
#wd{color:var(--sub);text-transform:capitalize;font-size:15px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:pointer}
.app:active .ic{transform:scale(.9)}
.ic{width:62px;height:62px;border-radius:19px;display:grid;place-items:center;font-size:30px;position:relative;transition:.2s;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),0 8px 18px var(--sh)}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.4),transparent 50%)}
#dock{position:absolute;left:14px;right:14px;bottom:30px;height:86px;border-radius:34px;display:flex;justify-content:space-around;align-items:center;padding:0 8px}
#dock .app span{display:none}
/* bloqueo */
#lock{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;padding-top:110px;transition:.5s cubic-bezier(.2,.9,.25,1)}
#lock.gone{transform:translateY(-105%);pointer-events:none}
#lt{font-size:88px;font-weight:200;letter-spacing:-3px}
#ld{font-size:19px;color:var(--sub);text-transform:capitalize}
.pill{position:absolute;bottom:60px;padding:12px 22px;border-radius:30px;font-size:14px;color:var(--sub);animation:pu 2.4s infinite}
@keyframes pu{50%{transform:translateY(-6px)}}
/* apps */
#app{position:absolute;inset:0;z-index:5;background:var(--appbg);-webkit-backdrop-filter:blur(34px);backdrop-filter:blur(34px);transform:scale(.1);opacity:0;pointer-events:none;border-radius:44px;transition:.42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column}
#app.show{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.ah{padding:58px 22px 8px;font-size:30px;font-weight:700}
.ab{flex:1;overflow:auto;padding:10px 18px 50px;touch-action:pan-y}
.sec{border-radius:26px;padding:6px 16px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid rgba(128,128,128,.18);flex-wrap:wrap}
.row:last-child{border:0}
.row small{display:block;color:var(--sub);font-size:11.5px}
.seg{display:flex;background:rgba(128,128,128,.2);border-radius:14px;padding:3px}
.seg button{padding:7px 14px;border-radius:11px;font-size:13px}
.seg .on{background:var(--acc);color:#fff}
#sw,#wp{display:flex;gap:10px}
#sw i{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
#sw i.on{border-color:var(--tx)}
#wp i{width:46px;height:46px;border-radius:14px;border:2px solid transparent;cursor:pointer}
#wp i.on{border-color:var(--acc)}
.tg{width:50px;height:30px;border-radius:15px;background:rgba(128,128,128,.35);position:relative;transition:.25s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s}
.tg.on{background:var(--acc)}.tg.on::after{left:23px}
.btn{width:100%;padding:14px;border-radius:18px;background:var(--acc);color:#fff;font-weight:600}
.cd{font-size:56px;font-weight:300;text-align:right;padding:20px 10px;min-height:100px;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ck button{height:62px;border-radius:22px;font-size:22px;background:rgba(128,128,128,.22)}
.ck .op{background:var(--acc);color:#fff}
.ck .z{grid-column:span 1}
textarea{width:100%;height:60vh;border-radius:24px;border:0;padding:18px;background:rgba(128,128,128,.18);color:var(--tx);font:17px/1.5 inherit;outline:0;resize:none;touch-action:auto;user-select:text}
.sw0{font-size:60px;font-weight:200;text-align:center;padding:40px 0;font-variant-numeric:tabular-nums}
.two{display:flex;gap:12px}.two button{flex:1;padding:14px;border-radius:18px;background:rgba(128,128,128,.25);font-weight:600}
/* centro de control */
#scrim{position:absolute;inset:0;z-index:9;display:none}#scrim.on{display:block;background:rgba(0,0,0,.25)}
#cc{position:absolute;top:0;left:12px;right:12px;z-index:10;border-radius:0 0 38px 38px;padding:56px 16px 20px;transform:translateY(-115%);transition:.45s cubic-bezier(.2,.9,.25,1)}
#cc.open{transform:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{height:74px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;background:rgba(255,255,255,.12)}
.tile .e{font-size:22px}.tile.on{background:var(--acc);color:#fff}
.sl{border-radius:24px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.sl input{flex:1;accent-color:var(--acc)}
/* arranque */
#boot{position:absolute;inset:0;z-index:30;background:#05060b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .7s}
#boot.hide{opacity:0;pointer-events:none}
.logo{width:92px;height:92px;border-radius:30px;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff;animation:pu 2s infinite}
#cc{max-height:85%;overflow:auto}
#pinp{position:absolute;inset:0;z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
#pinp.on{display:flex}
#pt{font-size:18px;color:#fff}#pd{display:flex;gap:14px}#pd i{width:14px;height:14px;border-radius:50%;border:2px solid #fff}#pd i.f{background:#fff}
#pk{display:grid;grid-template-columns:repeat(3,72px);gap:14px}#pk button{height:72px;border-radius:50%;font-size:26px;color:#fff;background:rgba(255,255,255,.16)}
#pc{color:rgba(255,255,255,.7)}
#bn{position:absolute;top:50px;left:14px;right:14px;z-index:13;border-radius:24px;padding:12px 16px;opacity:0;pointer-events:none;transform:translateY(-24px) scale(.96);transition:.35s cubic-bezier(.2,.9,.25,1);font-size:14px}#bn.on{opacity:1;transform:none}
#bn b,.nt b{display:block}
.nt{border-radius:20px;padding:10px 14px;margin-top:8px;font-size:13px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal span{padding:10px 0;border-radius:12px}.cal .h{color:var(--sub);font-size:12px}.cal .t{background:var(--acc);color:#fff}
.fi{width:100%;padding:14px;border-radius:16px;border:0;background:rgba(128,128,128,.2);color:var(--tx);font-size:16px;margin-bottom:10px;outline:0;user-select:text;touch-action:auto}
.ic{color:#fff}.ic svg{width:32px;height:32px}.tile .e svg,.sl svg,#lk svg{width:22px;height:22px}#pk svg,.ck svg{width:26px;height:26px}#lk{display:flex}
.ic.im{background:none;box-shadow:0 8px 18px var(--sh)}.ic.im::after{display:none}.ic.im img{width:100%;height:100%;border-radius:19px;display:block}
#grid{max-height:calc(100% - 340px);overflow-y:auto;touch-action:pan-y;padding-bottom:12px}
#app.web .ab{padding:0;overflow:hidden;display:flex}#app.web iframe{flex:1;width:100%;border:0;background:#0b0d1a}#app.web .ah{padding:50px 22px 8px;font-size:18px}
.ic:not(.im){background:linear-gradient(160deg,rgba(130,190,255,.6),rgba(15,55,150,.75))!important;border:1px solid rgba(190,225,255,.55);color:#e6f4ff}
#lock{color:#fff;--sub:rgba(255,255,255,.72)}
#lp{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}#lp i,#lp button{width:46px;height:46px;border-radius:14px;border:2px solid transparent;cursor:pointer;color:var(--tx);font-size:13px}#lp i.on{border-color:var(--acc)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="lg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="os">
  <div id="wall"><i class="blob"></i><i class="blob"></i><i class="blob"></i></div>
  <div id="home"><div class="widget glass"><div id="wt"></div><div id="wd"></div></div><div id="grid"></div><div id="dock" class="glass rf"></div></div>
  <div id="app"></div>
  <div id="lock"><div id="lt"></div><div id="ld"></div><div class="pill glass">Desliza hacia arriba para desbloquear</div></div>
  <div id="pinp"><div id="pt"></div><div id="pd"></div><div id="pk"></div><button id="pc">Cancelar</button></div>
  <div id="bn" class="glass"></div>
  <div id="scrim"></div>
  <div id="cc" class="glass rf">
    <div class="tiles"><button class="tile on" data-k="wifi"><span class="e" data-i="wifi"></span>Wi‑Fi</button><button class="tile on" data-k="bt"><span class="e" data-i="bt"></span>Bluetooth</button><button class="tile" data-k="air"><span class="e" data-i="air"></span>Avión</button><button class="tile" data-k="dark"><span class="e" data-i="moon"></span>Oscuro</button></div>
    <div class="sl glass"><span data-i="sun"></span><input id="br" type="range" min="40" max="100"><button id="lk" data-i="lock"></button></div><div id="nl"></div>
  </div>
  <div id="sb"><span id="sbt"></span><span>Wi‑Fi<span class="bat"><i></i></span></span></div>
  <div id="hb"></div>
  <div id="boot"><div class="logo glass" style="background:linear-gradient(145deg,#7aa7ff,#c24bff)">G</div><div style="font-size:20px;font-weight:600;letter-spacing:.5px">Graphical OS</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
let S={};try{S=JSON.parse(localStorage.gos||'{}')}catch(e){}
const cfg=Object.assign({theme:'dark',acc:'#7aa7ff',wall:0,lock:0,rf:false,br:100,wifi:true,bt:true,air:false},S);
const save=()=>{try{localStorage.gos=JSON.stringify(cfg)}catch(e){}};
const WALLS=[['#0a0d24','#4d6bff','#c24bff','#00d4ff'],['#1a0b14','#ff6a5c','#ffb347','#ff3d8b'],['#041a18','#00c9a7','#2d8cff','#7bffd4']];
const LOCKS=[
 'radial-gradient(60% 45% at 25% 15%,#6a5cff,transparent 60%),radial-gradient(55% 50% at 85% 35%,#00d4ff,transparent 60%),radial-gradient(70% 55% at 40% 95%,#ff4fd8,transparent 60%),#070914',
 'radial-gradient(70% 50% at 20% 10%,#ffb347,transparent 60%),radial-gradient(60% 55% at 90% 40%,#ff3d8b,transparent 60%),radial-gradient(80% 60% at 30% 100%,#5b2bff,transparent 60%),#12060f',
 'radial-gradient(60% 50% at 80% 10%,#2d8cff,transparent 60%),radial-gradient(60% 55% at 10% 45%,#00c9a7,transparent 60%),radial-gradient(80% 60% at 60% 100%,#0a3cff,transparent 60%),#031018',
 'radial-gradient(60% 40% at 50% 0%,#3b3fd8,transparent 65%),radial-gradient(70% 50% at 50% 100%,#8a2be2,transparent 60%),#05060f'];
const ACCS=['#7aa7ff','#c24bff','#ff6a5c','#00c9a7','#ffb347'];
function apply(){
  const r=document.documentElement,w=WALLS[cfg.wall],ws=$('#wall').style;
  r.classList.toggle('light',cfg.theme==='light');r.classList.toggle('refract',cfg.rf);
  r.style.setProperty('--acc',cfg.acc);
  ws.setProperty('--bg',cfg.theme==='light'?'#dfe6ff':w[0]);ws.setProperty('--b1',w[1]);ws.setProperty('--b2',w[2]);ws.setProperty('--b3',w[3]);
  $('#os').style.filter='brightness('+cfg.br/100+')';
  $('#lock').style.background=(cfg.lock<0&&cfg.lockImg)?'url('+cfg.lockImg+') center/cover':LOCKS[Math.max(0,cfg.lock)];
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('on',t.dataset.k==='dark'?cfg.theme==='dark':!!cfg[t.dataset.k]));
  $('#br').value=cfg.br;
}
/* reloj */
function tick(){
  const d=new Date(),t=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),ds=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  ['#sbt','#lt','#wt'].forEach(s=>$(s).textContent=t);$('#ld').textContent=ds+(cfg.user?' · '+cfg.user:'');$('#wd').textContent=ds;
}

/* PIN */
function askPin(title,cb){
  const p=$('#pinp'),d=$('#pd'),k=$('#pk');let v='';$('#pt').textContent=title;p.classList.add('on');
  const dots=()=>{d.innerHTML='';for(let i=0;i<4;i++)d.innerHTML+='<i'+(i<v.length?' class="f"':'')+'></i>'};
  k.innerHTML='';
  ['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(x=>{
    const b=document.createElement('button');if(x==='⌫')b.innerHTML=svg('back');else b.textContent=x;if(!x)b.style.visibility='hidden';
    b.onclick=()=>{
      if(x==='⌫')v=v.slice(0,-1);else if(v.length<4)v+=x;dots();
      if(v.length===4){const r=v;v='';setTimeout(()=>{dots();if(cb(r)!==false)p.classList.remove('on')},120)}
    };

  });

}
